<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 620" role="img" aria-labelledby="title desc">
<title id="title">八阶段并行门控全景</title>
<desc id="desc">阶段负责产物归属与整体验收；最小产物依赖决定启动，正式版本门控决定生产与放行。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#737373"/></marker><marker id="arrow-primary" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#654ACB"/></marker></defs>
<rect width="1560" height="620" fill="#F7F6F5"/>
<text x="36" y="53.8" fill="#0A0A0A" font-family="Helvetica,'Microsoft YaHei',sans-serif" font-size="28" font-weight="700" text-anchor="start"><tspan x="36" dy="0">八阶段并行门控全景</tspan></text>
<text x="36" y="90.6" fill="#404040" font-family="Helvetica,'Microsoft YaHei',sans-serif" font-size="16" font-weight="500" text-anchor="start"><tspan x="36" dy="0">阶段负责产物归属与整体验收；最小产物依赖决定启动，正式版本门控决定生产与放行。</tspan></text>
<rect id="s0" x="36" y="120" width="344" height="180" rx="12" fill="#654ACB" stroke="#654ACB" stroke-width="1"/>
<text x="52" y="171.6" fill="#FFFFFF" font-family="Helvetica,'Microsoft YaHei',sans-serif" font-size="16" font-weight="500" text-anchor="start"><tspan x="52" dy="0">0 立项</tspan><tspan x="52" dy="22">单元：项目 / 风格草案</tspan><tspan x="52" dy="22">启动：一句话创意</tspan><tspan x="52" dy="22">正式：六要素 + 前提五项 + 主风格</tspan><tspan x="52" dy="22">验收：0-final 定案</tspan></text>
<rect id="s1" x="420" y="120" width="344" height="180" rx="12" fill="#FFFFFF" stroke="#7373735C" stroke-width="1"/>
<text x="436" y="171.6" fill="#0A0A0A" font-family="Helvetica,'Microsoft YaHei',sans-serif" font-size="16" font-weight="500" text-anchor="start"><tspan x="436" dy="0">1 故事</tspan><tspan x="436" dy="22">单元：单集大纲 / 角色小传</tspan><tspan x="436" dy="22">启动：已确认立项对应版本</tspan><tspan x="436" dy="22">正式：大纲、小传分别确认</tspan><tspan x="436" dy="22">并行：角色定妆可同步启动</tspan></text>
<rect id="s2" x="804" y="120" width="344" height="180" rx="12" fill="#FFFFFF" stroke="#7373735C" stroke-width="1"/>
<text x="820" y="171.6" fill="#0A0A0A" font-family="Helvetica,'Microsoft YaHei',sans-serif" font-size="16" font-weight="500" text-anchor="start"><tspan x="820" dy="0">2 剧本分场</tspan><tspan x="820" dy="22">单元：单集 / 单场 / 台词</tspan><tspan x="820" dy="22">启动：该集大纲 + 相关人物</tspan><tspan x="820" dy="22">正式：该场分场与台词确认</tspan><tspan x="820" dy="22">并行：资产需求随场提取</tspan></text>
<rect id="s3" x="1188" y="120" width="344" height="180" rx="12" fill="#EEEFFF" stroke="#654ACB" stroke-width="1"/>
<text x="1204" y="171.6" fill="#0A0A0A" font-family="Helvetica,'Microsoft YaHei',sans-serif" font-size="16" font-weight="500" text-anchor="start"><tspan x="1204" dy="0">3 资产</tspan><tspan x="1204" dy="22">单元：角色 / 场景 / 道具 / 音频</tspan><tspan x="1204" dy="22">启动：小传或该场需求 + 主风格</tspan><tspan x="1204" dy="22">正式：候选选定 + QC + 人锁</tspan><tspan x="1204" dy="22">验收：必需资产覆盖完整</tspan></text>
<rect id="s4" x="36" y="330" width="344" height="180" rx="12" fill="#FFFFFF" stroke="#7373735C" stroke-width="1"/>
<text x="52" y="381.6" fill="#0A0A0A" font-family="Helvetica,'Microsoft YaHei',sans-serif" font-size="16" font-weight="500" text-anchor="start"><tspan x="52" dy="0">4 分镜</tspan><tspan x="52" dy="22">单元：单场 / 单镜</tspan><tspan x="52" dy="22">启动：该场剧本 + 逻辑资产需求</tspan><tspan x="52" dy="22">正式：资源 / 时长 / 断链校验</tspan><tspan x="52" dy="22">边界：规划不绑定媒体文件</tspan></text>
<rect id="s5" x="420" y="330" width="344" height="180" rx="12" fill="#EEEFFF" stroke="#654ACB" stroke-width="1"/>
<text x="436" y="381.6" fill="#0A0A0A" font-family="Helvetica,'Microsoft YaHei',sans-serif" font-size="16" font-weight="500" text-anchor="start"><tspan x="436" dy="0">5 镜头</tspan><tspan x="436" dy="22">单元：单镜 / 候选版本</tspan><tspan x="436" dy="22">启动：试产读草稿，正式读确认版</tspan><tspan x="436" dy="22">正式：实引版本齐备 + 逐镜 QC</tspan><tspan x="436" dy="22">边界：仅 continuation 建跨镜边</tspan></text>
<rect id="s6" x="804" y="330" width="344" height="180" rx="12" fill="#EEEFFF" stroke="#654ACB" stroke-width="1"/>
<text x="820" y="381.6" fill="#0A0A0A" font-family="Helvetica,'Microsoft YaHei',sans-serif" font-size="16" font-weight="500" text-anchor="start"><tspan x="820" dy="0">6 后期</tspan><tspan x="820" dy="22">单元：单集 / 音轨 / 字幕 / 模板</tspan><tspan x="820" dy="22">启动：模板、配乐草案可提前</tspan><tspan x="820" dy="22">正式：本集选版镜头 + 音频 + 时间码</tspan><tspan x="820" dy="22">验收：本集成片通过</tspan></text>
<rect id="s7" x="1188" y="330" width="344" height="180" rx="12" fill="#FFFFFF" stroke="#7373735C" stroke-width="1"/>
<text x="1204" y="381.6" fill="#0A0A0A" font-family="Helvetica,'Microsoft YaHei',sans-serif" font-size="16" font-weight="500" text-anchor="start"><tspan x="1204" dy="0">7 发布</tspan><tspan x="1204" dy="22">单元：单集 / 渠道 / 物料</tspan><tspan x="1204" dy="22">启动：封面、标题、文案可提前</tspan><tspan x="1204" dy="22">正式：本集成片 + 合规 + 物料</tspan><tspan x="1204" dy="22">边界：复盘等待真实上线数据</tspan></text>
<text x="36" y="577.6" fill="#404040" font-family="Helvetica,'Microsoft YaHei',sans-serif" font-size="16" font-weight="500" text-anchor="start"><tspan x="36" dy="0">单产物可提前验收并供下游使用；STAGE 完成仍要求所属必需产物覆盖完整、正式版本齐备且整体验收通过。</tspan></text>
</svg>
