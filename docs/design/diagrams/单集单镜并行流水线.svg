<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 800" role="img" aria-labelledby="title desc">
<title id="title">单集 · 单场 · 单镜并行流水线</title>
<desc id="desc">示例只展开 EpN / ScN / ShN；其他集、其他场和独立镜头复用同一结构并行推进。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#737373"/></marker><marker id="arrow-primary" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#654ACB"/></marker></defs>
<rect width="1560" height="800" fill="#F7F6F5"/>
<text x="36" y="53.8" fill="#0A0A0A" font-family="Helvetica,'Microsoft YaHei',sans-serif" font-size="28" font-weight="700" text-anchor="start"><tspan x="36" dy="0">单集 · 单场 · 单镜并行流水线</tspan></text>
<text x="36" y="90.6" fill="#404040" font-family="Helvetica,'Microsoft YaHei',sans-serif" font-size="16" font-weight="500" text-anchor="start"><tspan x="36" dy="0">示例只展开 EpN / ScN / ShN；其他集、其他场和独立镜头复用同一结构并行推进。</tspan></text>
<rect id="outline" x="36" y="130" width="240" height="84" rx="12" fill="#654ACB" stroke="#654ACB" stroke-width="1"/>
<text x="52" y="166.6" fill="#FFFFFF" font-family="Helvetica,'Microsoft YaHei',sans-serif" font-size="16" font-weight="500" text-anchor="start"><tspan x="52" dy="0">STAGE 0–1</tspan><tspan x="52" dy="22">EpN 大纲 + 相关小传</tspan></text>
<rect id="script" x="350" y="130" width="240" height="84" rx="12" fill="#FFFFFF" stroke="#7373735C" stroke-width="1"/>
<text x="366" y="166.6" fill="#0A0A0A" font-family="Helvetica,'Microsoft YaHei',sans-serif" font-size="16" font-weight="500" text-anchor="start"><tspan x="366" dy="0">STAGE 2</tspan><tspan x="366" dy="22">ScN 分场 + 台词</tspan></text>
<rect id="storyboard" x="664" y="130" width="240" height="84" rx="12" fill="#EEEFFF" stroke="#654ACB" stroke-width="1"/>
<text x="680" y="166.6" fill="#0A0A0A" font-family="Helvetica,'Microsoft YaHei',sans-serif" font-size="16" font-weight="500" text-anchor="start"><tspan x="680" dy="0">STAGE 4</tspan><tspan x="680" dy="22">ShN 分镜 + 逻辑资产需求</tspan></text>
<rect id="scene-assets" x="350" y="280" width="240" height="84" rx="12" fill="#FFFFFF" stroke="#7373735C" stroke-width="1"/>
<text x="366" y="316.6" fill="#0A0A0A" font-family="Helvetica,'Microsoft YaHei',sans-serif" font-size="16" font-weight="500" text-anchor="start"><tspan x="366" dy="0">STAGE 3</tspan><tspan x="366" dy="22">ScN 场景 / 道具候选</tspan></text>
<rect id="character" x="350" y="420" width="240" height="84" rx="12" fill="#FFFFFF" stroke="#7373735C" stroke-width="1"/>
<text x="366" y="456.6" fill="#0A0A0A" font-family="Helvetica,'Microsoft YaHei',sans-serif" font-size="16" font-weight="500" text-anchor="start"><tspan x="366" dy="0">STAGE 1→3</tspan><tspan x="366" dy="22">角色基础定妆候选</tspan></text>
<rect id="media-versions" x="664" y="330" width="240" height="84" rx="12" fill="#EEEFFF" stroke="#654ACB" stroke-width="1"/>
<text x="680" y="355.6" fill="#0A0A0A" font-family="Helvetica,'Microsoft YaHei',sans-serif" font-size="16" font-weight="500" text-anchor="start"><tspan x="680" dy="0">STAGE 4</tspan><tspan x="680" dy="22">ShN 实引媒体版本</tspan><tspan x="680" dy="22">绑定已确认资产版本</tspan></text>
<rect id="shot-gate" x="978" y="200" width="240" height="124" rx="12" fill="#EEEFFF" stroke="#654ACB" stroke-width="1"/>
<text x="994" y="234.6" fill="#0A0A0A" font-family="Helvetica,'Microsoft YaHei',sans-serif" font-size="16" font-weight="500" text-anchor="start"><tspan x="994" dy="0">正式单镜门</tspan><tspan x="994" dy="22">分镜已确认</tspan><tspan x="994" dy="22">实引版本已确认</tspan><tspan x="994" dy="22">连续关系已满足</tspan></text>
<rect id="shot" x="978" y="390" width="240" height="90" rx="12" fill="#FFFFFF" stroke="#7373735C" stroke-width="1"/>
<text x="994" y="418.6" fill="#0A0A0A" font-family="Helvetica,'Microsoft YaHei',sans-serif" font-size="16" font-weight="500" text-anchor="start"><tspan x="994" dy="0">STAGE 5</tspan><tspan x="994" dy="22">ShN 正式生成 + QC</tspan><tspan x="994" dy="22">独立镜头可并行</tspan></text>
<rect id="audio" x="664" y="540" width="240" height="84" rx="12" fill="#FFFFFF" stroke="#7373735C" stroke-width="1"/>
<text x="680" y="565.6" fill="#0A0A0A" font-family="Helvetica,'Microsoft YaHei',sans-serif" font-size="16" font-weight="500" text-anchor="start"><tspan x="680" dy="0">STAGE 3 / 6</tspan><tspan x="680" dy="22">台词、音乐需求 → 音频</tspan><tspan x="680" dy="22">字幕 / 片头尾可预制</tspan></text>
<rect id="episode" x="1292" y="540" width="240" height="90" rx="12" fill="#EEEFFF" stroke="#654ACB" stroke-width="1"/>
<text x="1308" y="568.6" fill="#0A0A0A" font-family="Helvetica,'Microsoft YaHei',sans-serif" font-size="16" font-weight="500" text-anchor="start"><tspan x="1308" dy="0">STAGE 6</tspan><tspan x="1308" dy="22">EpN 最终合成 / 验收</tspan><tspan x="1308" dy="22">不等其他集</tspan></text>
<rect id="publish-prep" x="978" y="684" width="240" height="76" rx="12" fill="#FFFFFF" stroke="#7373735C" stroke-width="1"/>
<text x="994" y="716.6" fill="#0A0A0A" font-family="Helvetica,'Microsoft YaHei',sans-serif" font-size="16" font-weight="500" text-anchor="start"><tspan x="994" dy="0">STAGE 7</tspan><tspan x="994" dy="22">标题 / 封面 / 文案预制</tspan></text>
<rect id="publish" x="1292" y="684" width="240" height="76" rx="12" fill="#654ACB" stroke="#654ACB" stroke-width="1"/>
<text x="1308" y="705.6" fill="#FFFFFF" font-family="Helvetica,'Microsoft YaHei',sans-serif" font-size="16" font-weight="500" text-anchor="start"><tspan x="1308" dy="0">STAGE 7</tspan><tspan x="1308" dy="22">EpN 合规发布</tspan><tspan x="1308" dy="22">渠道顺序只是策略</tspan></text>
<text x="36" y="711.6" fill="#404040" font-family="Helvetica,'Microsoft YaHei',sans-serif" font-size="16" font-weight="500" text-anchor="start"><tspan x="36" dy="0">边界：T2V 空镜不等角色参考图；无对白镜不挂音色；普通相邻镜不建边，只有 continuation / 前段末帧或视频引用才形成跨镜依赖。</tspan></text>
