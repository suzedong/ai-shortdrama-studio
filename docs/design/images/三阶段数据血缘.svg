<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arrGray" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#9AA0B4"/>
    </marker>
    <marker id="arrGreen" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#22C55E"/>
    </marker>
    <marker id="arrCyan" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#14B8A6"/>
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="70" y="38" font-size="19" font-weight="800" fill="#1E2233">三阶段数据血缘 · 两条主键贯穿</text>
  <text x="70" y="63" font-size="12.5" fill="#6B7188">纵向为定稿流转，绿/青虚线为跨产物引用：角色 id 与场号 sceneNo</text>

  <!-- Stage 容器 -->
  <rect x="70" y="84" width="840" height="110" rx="14" fill="#FCFCFE" stroke="#D8DBE6" stroke-width="1.3" stroke-dasharray="5 4"/>
  <rect x="70" y="220" width="840" height="120" rx="14" fill="#FCFCFE" stroke="#D8DBE6" stroke-width="1.3" stroke-dasharray="5 4"/>
  <rect x="70" y="378" width="840" height="168" rx="14" fill="#FCFCFE" stroke="#D8DBE6" stroke-width="1.3" stroke-dasharray="5 4"/>

  <!-- Stage 标签 -->
  <rect x="92" y="70" width="152" height="26" rx="13" fill="#EFEDFE" stroke="#D9D4F9"/>
  <text x="104" y="87" font-size="12" fill="#4A3FB8">STAGE 0 · 立项</text>
  <rect x="92" y="206" width="172" height="26" rx="13" fill="#EFEDFE" stroke="#D9D4F9"/>
  <text x="104" y="223" font-size="12" fill="#4A3FB8">STAGE 1 · 故事创作</text>
  <rect x="92" y="364" width="172" height="26" rx="13" fill="#EFEDFE" stroke="#D9D4F9"/>
  <text x="104" y="381" font-size="12" fill="#4A3FB8">STAGE 2 · 剧本分镜</text>

  <!-- 定稿流转：立项·档案事实输入 -->
  <path d="M630,174 V240" fill="none" stroke="#9AA0B4" stroke-width="2.2" marker-end="url(#arrGray)"/>
  <rect x="636" y="186" width="140" height="18" fill="#F6F7FB"/>
  <text x="644" y="199" font-size="11.5" fill="#6B7188">立项·档案事实输入</text>

  <!-- 定稿流转：大纲+小传 → 分场 -->
  <path d="M230,279 H60 V459 H88" fill="none" stroke="#9AA0B4" stroke-width="2.2" marker-end="url(#arrGray)"/>
  <rect x="68" y="344" width="122" height="24" rx="12" fill="#fff" stroke="#E7E9F2"/>
  <text x="129" y="360" font-size="11.5" text-anchor="middle" fill="#6B7188">大纲＋小传 →</text>

  <!-- 角色 id 引用（绿色虚线） -->
  <path d="M630,318 V372" fill="none" stroke="#22C55E" stroke-width="2" stroke-dasharray="6 5"/>
  <path d="M300,372 H780" fill="none" stroke="#22C55E" stroke-width="2" stroke-dasharray="6 5"/>
  <path d="M300,372 V413" fill="none" stroke="#22C55E" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrGreen)"/>
  <path d="M490,372 V413" fill="none" stroke="#22C55E" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrGreen)"/>
  <path d="M780,372 V413" fill="none" stroke="#22C55E" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrGreen)"/>
  <rect x="650" y="346" width="170" height="24" rx="12" fill="#34D399"/>
  <text x="735" y="362" font-size="11.5" text-anchor="middle" fill="#064E3B">CharacterProfile.id</text>
  <text x="300" y="405" font-size="12" text-anchor="middle" fill="#6B7188">characterIds[]</text>
  <text x="490" y="405" font-size="12" text-anchor="middle" fill="#6B7188">speakerId</text>
  <text x="780" y="405" font-size="12" text-anchor="middle" fill="#6B7188">characterIds[]</text>

  <!-- 场号 sceneNo 引用（青色虚线） -->
  <path d="M250,503 V520 H770" fill="none" stroke="#14B8A6" stroke-width="2" stroke-dasharray="6 5"/>
  <path d="M250,520 V505" fill="none" stroke="#14B8A6" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrCyan)"/>
  <path d="M490,520 V505" fill="none" stroke="#14B8A6" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrCyan)"/>
  <path d="M770,520 V505" fill="none" stroke="#14B8A6" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrCyan)"/>
  <rect x="92" y="508" width="152" height="24" rx="12" fill="#CCFBF1" stroke="#14B8A6"/>
  <text x="168" y="524" font-size="11.5" text-anchor="middle" fill="#0F766E">Scene.sceneNo 场号键</text>

  <!-- Stage 0 卡片 -->
  <rect x="230" y="108" width="240" height="66" rx="10" fill="#1E2233"/>
  <text x="250" y="134" font-size="14" font-weight="700" fill="#fff">立项单</text>
  <text x="250" y="153" font-size="11" fill="#AAB2CC">立项单.vN.json · 六要素/视觉</text>
  <rect x="510" y="108" width="240" height="66" rx="10" fill="#1E2233"/>
  <text x="530" y="134" font-size="14" font-weight="700" fill="#fff">故事背景档案</text>
  <text x="530" y="153" font-size="11" fill="#AAB2CC">故事背景档案.md</text>

  <!-- Stage 1 卡片 -->
  <rect x="230" y="246" width="240" height="66" rx="10" fill="#1E2233"/>
  <text x="250" y="275" font-size="14" font-weight="700" fill="#fff">故事大纲</text>
  <text x="250" y="298" font-size="11.5" fill="#AAB2CC">故事/故事大纲.json</text>
  <rect x="510" y="240" width="240" height="78" rx="10" fill="#065F46" stroke="#34D399" stroke-width="1.5"/>
  <rect x="636" y="248" width="92" height="22" rx="11" fill="#34D399"/>
  <text x="682" y="263" font-size="11" text-anchor="middle" fill="#064E3B">id 诞生地</text>
  <text x="530" y="269" font-size="14" font-weight="700" fill="#fff">人物小传</text>
  <text x="530" y="297" font-size="11.5" fill="#A7F3D0">故事/人物小传.json</text>

  <!-- Stage 2 卡片 -->
  <rect x="90" y="415" width="240" height="88" rx="10" fill="#1E2233"/>
  <text x="110" y="443" font-size="14" font-weight="700" fill="#fff">分场</text>
  <text x="110" y="466" font-size="11.5" fill="#AAB2CC">剧本/分场.json</text>
  <text x="110" y="489" font-size="12" fill="#5EEAD4">sceneNo 主键</text>

  <rect x="370" y="415" width="240" height="88" rx="10" fill="#1E2233"/>
  <text x="390" y="443" font-size="14" font-weight="700" fill="#fff">台词</text>
  <text x="390" y="466" font-size="11.5" fill="#AAB2CC">剧本/台词.json</text>
  <text x="390" y="489" font-size="12" fill="#AAB2CC">按 sceneNo 归场</text>

  <rect x="650" y="415" width="240" height="88" rx="10" fill="#1E2233"/>
  <text x="670" y="443" font-size="14" font-weight="700" fill="#fff">分镜表</text>
  <text x="670" y="466" font-size="11.5" fill="#AAB2CC">分镜/shotlist.json</text>
  <text x="670" y="489" font-size="12" fill="#AAB2CC">按 sceneNo 归属</text>

  <!-- 图例 -->
  <line x1="90" y1="588" x2="128" y2="588" stroke="#9AA0B4" stroke-width="2.5"/>
  <text x="136" y="592" font-size="12" fill="#6B7188">定稿流转（确认门后落盘）</text>
  <line x1="360" y1="588" x2="398" y2="588" stroke="#22C55E" stroke-width="2.5" stroke-dasharray="6 5"/>
  <text x="406" y="592" font-size="12" fill="#6B7188">角色 id 引用</text>
  <line x1="540" y1="588" x2="578" y2="588" stroke="#14B8A6" stroke-width="2.5" stroke-dasharray="6 5"/>
  <text x="586" y="592" font-size="12" fill="#6B7188">场号 sceneNo 引用</text>
</svg>
