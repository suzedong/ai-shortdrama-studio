<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 660" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="rGray" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8FA59F"/>
    </marker>
  </defs>

  <!-- 1. Electron 应用壳 -->
  <rect x="30" y="24" width="920" height="108" rx="14" fill="#fff" stroke="#C9DCD6" stroke-width="1.4"/>
  <text x="50" y="52" font-size="15" font-weight="800" fill="#1F3A35">Electron 应用壳 · @hilo/hub v43.1.0（com.minimax.hub）</text>
  <rect x="50" y="66" width="270" height="50" rx="9" fill="#EAF5F1" stroke="#C9DCD6"/>
  <text x="185" y="97" font-size="13" text-anchor="middle" fill="#2C4A44">中间画布（自动连线）</text>
  <rect x="355" y="66" width="270" height="50" rx="9" fill="#EAF5F1" stroke="#C9DCD6"/>
  <text x="490" y="97" font-size="13" text-anchor="middle" fill="#2C4A44">右侧 Agent 对话区</text>
  <rect x="660" y="66" width="270" height="50" rx="9" fill="#EAF5F1" stroke="#C9DCD6"/>
  <text x="795" y="97" font-size="13" text-anchor="middle" fill="#2C4A44">Skill / 模板 / 项目资产</text>

  <path d="M490,132 V172" fill="none" stroke="#8FA59F" stroke-width="2.2" marker-end="url(#rGray)"/>

  <!-- 2. Agent 运行时（绿色高亮） -->
  <rect x="30" y="176" width="920" height="118" rx="14" fill="#E5F6F1" stroke="#2E9E8A" stroke-width="1.6"/>
  <text x="50" y="206" font-size="15" font-weight="800" fill="#1F6B5C">Agent 运行时 · 标准 opencode（opencode.exe，agent-profiles/v2）</text>
  <rect x="50" y="220" width="160" height="56" rx="9" fill="#1F6B5C"/>
  <text x="130" y="254" font-size="13" text-anchor="middle" fill="#fff">router</text>
  <rect x="230" y="220" width="160" height="56" rx="9" fill="#1F6B5C"/>
  <text x="310" y="254" font-size="13" text-anchor="middle" fill="#fff">planner</text>
  <rect x="410" y="220" width="160" height="56" rx="9" fill="#1F6B5C"/>
  <text x="490" y="254" font-size="13" text-anchor="middle" fill="#fff">executor</text>
  <rect x="590" y="220" width="160" height="56" rx="9" fill="#1F6B5C"/>
  <text x="670" y="254" font-size="13" text-anchor="middle" fill="#fff">media-agent</text>
  <rect x="770" y="220" width="160" height="56" rx="9" fill="#1F6B5C"/>
  <text x="850" y="254" font-size="13" text-anchor="middle" fill="#fff">comfyui-agent</text>

  <path d="M490,294 V334" fill="none" stroke="#8FA59F" stroke-width="2.2" marker-end="url(#rGray)"/>
  <rect x="506" y="302" width="90" height="22" rx="11" fill="#fff" stroke="#C9DCD6"/>
  <text x="551" y="317" font-size="11.5" text-anchor="middle" fill="#5F7A74">MCP 协议</text>

  <!-- 3. MCP 网关 -->
  <rect x="30" y="338" width="920" height="106" rx="14" fill="#fff" stroke="#C9DCD6" stroke-width="1.4"/>
  <text x="50" y="366" font-size="15" font-weight="800" fill="#1F3A35">MCP 网关 · http://localhost:8001（仅 127.0.0.1）· mcp-tools/hub_*</text>
  <rect x="50" y="380" width="270" height="50" rx="9" fill="#EAF5F1" stroke="#C9DCD6"/>
  <text x="185" y="411" font-size="13" text-anchor="middle" fill="#2C4A44">画布读写</text>
  <rect x="355" y="380" width="270" height="50" rx="9" fill="#EAF5F1" stroke="#C9DCD6"/>
  <text x="490" y="411" font-size="13" text-anchor="middle" fill="#2C4A44">媒体生成</text>
  <rect x="660" y="380" width="270" height="50" rx="9" fill="#EAF5F1" stroke="#C9DCD6"/>
  <text x="795" y="411" font-size="13" text-anchor="middle" fill="#2C4A44">ComfyUI 工作流管理</text>

  <path d="M490,444 V470 L255,500" fill="none" stroke="#8FA59F" stroke-width="2.2" marker-end="url(#rGray)"/>
  <path d="M490,444 V470 L725,500" fill="none" stroke="#8FA59F" stroke-width="2.2" marker-end="url(#rGray)"/>

  <!-- 4a 本地数据与资源 -->
  <rect x="30" y="504" width="450" height="138" rx="14" fill="#fff" stroke="#C9DCD6" stroke-width="1.4"/>
  <text x="50" y="532" font-size="14" font-weight="800" fill="#1F3A35">本地数据与资源</text>
  <text x="50" y="560" font-size="12.5" fill="#46635C">· hub-config.json（APPDATA，token v2enc 加密）</text>
  <text x="50" y="586" font-size="12.5" fill="#46635C">· Projects / asset-center / output_files</text>
  <text x="50" y="612" font-size="12.5" fill="#46635C">· 9 个 Skills + 内嵌 ComfyUI 前端</text>
  <text x="50" y="638" font-size="12.5" fill="#5F7A74">端口 8002 工作区运行时 / 10268 内部</text>

  <!-- 4b 外部执行端 -->
  <rect x="500" y="504" width="450" height="138" rx="14" fill="#fff" stroke="#C9DCD6" stroke-width="1.4"/>
  <text x="520" y="532" font-size="14" font-weight="800" fill="#1F3A35">外部执行端</text>
  <text x="520" y="560" font-size="12.5" fill="#46635C">· 云端模型矩阵（external_api_conf.yaml）</text>
  <text x="520" y="586" font-size="12.5" fill="#46635C">· 视频 / 图像 / 语音 / 音乐 多模型</text>
  <text x="520" y="612" font-size="12.5" fill="#46635C">· Hub 托管 ComfyUI（随应用启动）</text>
  <text x="520" y="638" font-size="12.5" font-weight="700" fill="#C0504D">· 监听地址不可配，连不了局域网</text>
</svg>
